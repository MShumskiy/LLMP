# LLMP settings that aren't secrets. Secrets and connection details stay in .env.
# Another file can be used by pointing LLMP_CONFIG at it.

[ollama]
# Defaults for /v1 calls; a request can override both with llmp.keep_alive / llmp.num_ctx.
# Changing num_ctx between calls makes Ollama reload the model, so keep it stable per model.
keep_alive = "30m"
num_ctx = 32768
# num_ctx for embedding models (also capped at the model's context). Their inputs are short, and
# context costs VRAM while the model stays loaded: qwen3-embedding:0.6b uses 1.6 GB at 8192, 4.4 GB at 32768.
embed_num_ctx = 8192
# Match OLLAMA_NUM_PARALLEL, so parallel callers queue in LLMP instead of thrashing VRAM.
max_concurrency = 2

[ollama.num_ctx_per_model]
# "gpt-oss:20b" = 65536

[ollama.max_output_per_model]
# Reported as max_output in /v1/models. Ollama itself only limits output by num_ctx.
# "gpt-oss:20b" = 16384

[openrouter]
max_concurrency = 16
# Which OpenRouter models /v1/models lists (glob patterns allowed). An empty list lists all
# of them. Chat calls are not restricted to this list.
allowlist = [
    "anthropic/claude-sonnet-5.5",
    "anthropic/claude-opus-5.5",
    "anthropic/claude-haiku-5.5",
    "openai/gpt-5.6-terra",
    "openai/gpt-5.6-luna",
    "openai/gpt-oss-120b",
    "google/gemini-3.8-flash",
    "google/gemini-3.5-flash-lite",
    "qwen/qwen3-235b-a22b-2507",
    "qwen/qwen3-coder-next",
    "qwen/qwen3.7-flash",
    "qwen/qwen3.8-flash",
    "deepseek/deepseek-v3.2",
    "moonshotai/kimi-k2.7-code",
    "z-ai/glm-4.7",
    "z-ai/glm-4.7-flash",
    "x-ai/grok-4.7",
    "mistralai/devstral-2512",
]

[catalog]
# How long /v1/models results are cached. ?refresh=1 forces a refresh.
ttl_s = 600

[logging]
# How much of each /v1 request goes into chat_log: "full", "last_message" or "meta".
# A request can choose with llmp.log.
default_mode = "last_message"
